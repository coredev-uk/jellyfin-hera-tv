---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Checks the scripts and builds Hera TV on every pull request and push to main, so a plugin that
# fails to compile never merges. Releases are built and published by release.yaml, through the
# plugin repository's manifest.
name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job asks for what it needs; none writes anything.
permissions: {}

jobs:
  # The web client loads the scripts as they are, so a syntax error would break every page; and what
  # a Jellyfin update can break quietly is checked here before it can: names that do not exist,
  # selectors for Jellyfin's markup written outside the JF map, a stylesheet or module the server
  # does not know of, and a Jellyfin version or Sqlite that the places naming them disagree on.
  check:
    name: Check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Syntax
        run: for file in web/*.js Configuration/*.js; do node --check "$file"; done

      - name: Install
        run: npm ci

      # no-undef and no-unused-vars on the scripts, and a failure for a Jellyfin class or id in a selector
      # outside the JF map (tests/lint/jellyfin-selectors.mjs).
      - name: Lint
        run: npm run lint

      # The checks' own tests: a verdict that cannot fail is no check.
      - name: Tests
        run: npm test

      # WebAssets.cs's manifest against web/*.js, web/*.css and the module names the scripts register.
      - name: Manifest
        run: node tests/compat/manifest.mjs

      # Jellyfin.Controller's major.minor against meta.json's targetAbi and Compatibility.Tested, and the
      # Sqlite packages against the ones Jellyfin pins for that release (it reads its file from GitHub).
      - name: Jellyfin version and Sqlite
        run: node tests/compat/versions.mjs

  # TreatWarningsAsErrors in the project file makes a warning fail the build too.
  plugin:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The web files lowered for older TV browsers (tools/legacy), which the build embeds when they are there.
      - name: Legacy web assets
        uses: ./.github/actions/legacy-assets

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.HeraTv.csproj -c Release -o out

      - name: Legacy assets are in the plugin
        run: .github/scripts/legacy-embedded.sh out/Jellyfin.Plugin.HeraTv.dll
