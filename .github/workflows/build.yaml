---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Checks the scripts and builds Hera TV on every pull request and push to main, so a plugin that
# fails to compile never merges. Releases are built and published by release.yaml, through the
# plugin repository's manifest.
name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job asks for what it needs; none writes anything.
permissions: {}

jobs:
  # The web client loads the scripts as they are, so a syntax error would break every page.
  check:
    name: Check scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: for file in web/*.js Configuration/*.js; do node --check "$file"; done

  # TreatWarningsAsErrors in the project file makes a warning fail the build too.
  plugin:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.HeraTv.csproj -c Release -o out
