---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Runs the built plugin inside a real Jellyfin server and drives its web client with Chromium
# (tests/compat). It fails when the plugin did not load or logged an error, when any Hera endpoint
# answers with a 5xx or the wrong status, when a scheduled task fails, when Jellyfin does not stay up
# with a film playing, and when any page, in the desktop, TV or signed-out layout, shows that Hera is
# not working: window.HeraTV missing, safe mode, a module idle, partial, degraded or disabled, a
# console error from the bundle, or nothing of Hera's drawn there.
#
# Pull requests and main run against the Jellyfin release the plugin is built for (the
# Jellyfin.Controller version in the project file). release.yaml waits for the run on main and
# publishes only if it passed. The nightly run adds Jellyfin's `latest` and `unstable` images, in two
# forms: this build, as released, and a build recompiled against the newest Jellyfin.Controller on
# NuGet (stable for `latest`, prerelease for `unstable`), so a Jellyfin member that was removed is a
# compile error found the night it is published rather than a MissingMethodException on a server.
# One issue per tag collects both, so a Jellyfin release that changes the web client or the server
# API is known about before the server is updated.
name: compat

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      jellyfin_tag:
        description: Jellyfin image tag to test (default is the release the plugin is built for)
        type: string
        required: false
  schedule:
    - cron: 0 4 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Which Jellyfin images to test: only the tested release, or on the nightly also the newer ones.
  tags:
    name: Choose Jellyfin tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.choose.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.jellyfin_tag }}
        run: |
          tested=$(node tests/compat/tag.mjs)
          if [ "$EVENT" = schedule ]; then
            tags=$(printf '%s\n' "$tested" latest unstable | jq -R . | jq -sc .)
          elif [ -n "$REQUESTED" ]; then
            if ! printf '%s' "$REQUESTED" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "::error::'$REQUESTED' is not a Docker tag"
              exit 1
            fi
            tags=$(jq -nc --arg tag "$REQUESTED" '[$tag]')
          else
            tags=$(jq -nc --arg tag "$tested" '[$tag]')
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Testing Jellyfin: $tags" >> "$GITHUB_STEP_SUMMARY"

  # Built as release.yaml builds it, so the plugin under test is the one that ships.
  plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The web files lowered for older TV browsers (tools/legacy), embedded like the rest.
      - name: Legacy web assets
        uses: ./.github/actions/legacy-assets

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.HeraTv.csproj -c Release -o out

      - name: Legacy assets are in the plugin
        run: .github/scripts/legacy-embedded.sh out/Jellyfin.Plugin.HeraTv.dll

      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: out/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Jellyfin ${{ matrix.tag }}
    needs: [tags, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tags.outputs.tags) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: out

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/compat/package-lock.json

      - name: Install
        working-directory: tests/compat
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: tests/compat
        env:
          TAG: ${{ matrix.tag }}
        run: node run.mjs --tag "$TAG" --plugin ../../out

      - name: Summary
        if: ${{ !cancelled() }}
        run: '[ ! -f tests/compat/results/summary.md ] || cat tests/compat/results/summary.md >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload screenshots and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ matrix.tag }}
          path: tests/compat/results/
          if-no-files-found: warn
          retention-days: 14

  # Nightly only: Hera recompiled against the newest Jellyfin.Controller and Jellyfin.Model on NuGet,
  # and run against the Jellyfin image that goes with them. Nothing newer than the releases means the
  # `unstable` run has nothing to rebuild and is skipped.
  rebuilt:
    name: Rebuilt for ${{ matrix.tag }}
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: stable
            tag: latest
          - kind: prerelease
            tag: unstable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/compat/package-lock.json

      - name: Newest Jellyfin.Controller
        id: version
        env:
          KIND: ${{ matrix.kind }}
        run: |
          version=$(node tests/compat/newest.mjs "$KIND")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Rebuilding against Jellyfin.Controller $version ($KIND)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No $KIND Jellyfin.Controller newer than the releases: nothing to rebuild" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The web files lowered for older TV browsers (tools/legacy), embedded like the rest.
      - name: Legacy web assets
        if: ${{ steps.version.outputs.version != '' }}
        run: |
          npm ci
          npm run build:legacy

      - name: Setup .NET
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # `dotnet add package` rewrites the version in this checkout's project file only.
      - name: Build
        id: build
        if: ${{ steps.version.outputs.version != '' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          {
            dotnet add Jellyfin.Plugin.HeraTv.csproj package Jellyfin.Controller --version "$VERSION"
            dotnet add Jellyfin.Plugin.HeraTv.csproj package Jellyfin.Model --version "$VERSION"
            dotnet build Jellyfin.Plugin.HeraTv.csproj -c Release -o out
          } 2>&1 | tee build.log

      - name: Legacy assets are in the plugin
        if: ${{ steps.build.outcome == 'success' }}
        run: .github/scripts/legacy-embedded.sh out/Jellyfin.Plugin.HeraTv.dll

      - name: Summarise a build that failed
        if: ${{ steps.build.outcome == 'failure' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ matrix.tag }}
        run: node tests/compat/build-failure.mjs --log build.log --controller "$VERSION" --tag "$TAG" --out tests/compat/results

      - name: Install
        if: ${{ steps.build.outcome == 'success' }}
        working-directory: tests/compat
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        if: ${{ steps.build.outcome == 'success' }}
        working-directory: tests/compat
        env:
          TAG: ${{ matrix.tag }}
        run: node run.mjs --tag "$TAG" --plugin ../../out

      - name: Summary
        if: ${{ !cancelled() }}
        run: '[ ! -f tests/compat/results/summary.md ] || cat tests/compat/results/summary.md >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload screenshots and summary
        if: ${{ !cancelled() && steps.version.outputs.version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ matrix.tag }}-rebuilt
          path: tests/compat/results/
          if-no-files-found: warn
          retention-days: 14

      # The artifact is uploaded first; this is what turns the nightly run red.
      - name: Fail when the build failed
        if: ${{ steps.build.outcome == 'failure' }}
        run: exit 1

  # The check branch protection requires. The test jobs are named after the Jellyfin release they
  # run against, which changes with every Jellyfin bump; this one keeps one name and fails unless
  # every one of them passed.
  gate:
    name: Compatibility
    needs: [plugin, test]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every compatibility run passed
        env:
          PLUGIN: ${{ needs.plugin.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "plugin: $PLUGIN, test: $TEST"
          [ "$PLUGIN" = success ] && [ "$TEST" = success ]

  # One issue per newer Jellyfin tag: opened or updated while either run fails, closed when both pass.
  # Only the nightly run reports, and only for the tags that are not the tested release.
  report:
    name: Report ${{ matrix.tag }}
    needs: [test, rebuilt]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        tag:
          - latest
          - unstable
    steps:
      - name: Download results of this build
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compat-${{ matrix.tag }}
          path: results/built

      - name: Download results of the rebuilt one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compat-${{ matrix.tag }}-rebuilt
          path: results/rebuilt

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Compatibility: Jellyfin $TAG"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" 'map(select(.title == $title)) | first | .number // empty')
          built=$(jq -r .status results/built/summary.json 2>/dev/null || echo missing)
          # A rebuild that was not run (nothing newer on NuGet, or the job could not start) is no finding.
          rebuilt=$(jq -r .status results/rebuilt/summary.json 2>/dev/null || echo none)

          if [ "$built" = passed ] && { [ "$rebuilt" = passed ] || [ "$rebuilt" = none ]; }; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Hera passes against Jellyfin \`$TAG\` again: $RUN_URL"
            fi
            exit 0
          fi

          {
            echo "### This build, as released"
            echo
            if [ -f results/built/summary.md ]; then
              cat results/built/summary.md
            else
              echo "The run for Jellyfin \`$TAG\` produced no summary."
            fi
            if [ "$rebuilt" != none ]; then
              echo
              echo "### Recompiled against the newest Jellyfin packages"
              echo
              cat results/rebuilt/summary.md
            fi
            echo
            echo "Screenshots and the server log are attached to [the run]($RUN_URL)."
          } > body.md

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi
