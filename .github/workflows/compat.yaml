---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Runs the built plugin inside a real Jellyfin server and drives its web client with Chromium
# (tests/compat), failing when Hera reports that any page is broken: window.HeraTV missing, safe
# mode, or a module degraded or disabled. Pull requests and main run against the Jellyfin release
# the plugin is built for (the Jellyfin.Controller version in the project file). The nightly run
# adds Jellyfin's `latest` and `unstable` images, and keeps one issue per tag up to date, so a
# Jellyfin release that changes the web client is known about before the server is updated.
name: compat

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      jellyfin_tag:
        description: Jellyfin image tag to test (default is the release the plugin is built for)
        type: string
        required: false
  schedule:
    - cron: 0 4 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Which Jellyfin images to test: only the tested release, or on the nightly also the newer ones.
  tags:
    name: Choose Jellyfin tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.choose.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.jellyfin_tag }}
        run: |
          tested=$(node tests/compat/tag.mjs)
          if [ "$EVENT" = schedule ]; then
            tags=$(printf '%s\n' "$tested" latest unstable | jq -R . | jq -sc .)
          elif [ -n "$REQUESTED" ]; then
            if ! printf '%s' "$REQUESTED" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "::error::'$REQUESTED' is not a Docker tag"
              exit 1
            fi
            tags=$(jq -nc --arg tag "$REQUESTED" '[$tag]')
          else
            tags=$(jq -nc --arg tag "$tested" '[$tag]')
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Testing Jellyfin: $tags" >> "$GITHUB_STEP_SUMMARY"

  # Built as release.yaml builds it, so the plugin under test is the one that ships.
  plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.HeraTv.csproj -c Release -o out

      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: out/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Jellyfin ${{ matrix.tag }}
    needs: [tags, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tags.outputs.tags) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: out

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/compat/package-lock.json

      - name: Install
        working-directory: tests/compat
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        working-directory: tests/compat
        env:
          TAG: ${{ matrix.tag }}
        run: node run.mjs --tag "$TAG" --plugin ../../out

      - name: Summary
        if: ${{ !cancelled() }}
        run: '[ ! -f tests/compat/results/summary.md ] || cat tests/compat/results/summary.md >> "$GITHUB_STEP_SUMMARY"'

      - name: Upload screenshots and summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ matrix.tag }}
          path: tests/compat/results/
          if-no-files-found: warn
          retention-days: 14

  # One issue per newer Jellyfin tag: opened or updated while it fails, closed when it passes.
  # Only the nightly run reports, and only for the tags that are not the tested release.
  report:
    name: Report ${{ matrix.tag }}
    needs: test
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        tag:
          - latest
          - unstable
    steps:
      - name: Download results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compat-${{ matrix.tag }}
          path: results

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Compatibility: Jellyfin $TAG"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" 'map(select(.title == $title)) | first | .number // empty')
          status=$(jq -r .status results/summary.json 2>/dev/null || echo missing)

          if [ "$status" = passed ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Hera passes against Jellyfin \`$TAG\` again: $RUN_URL"
            fi
            exit 0
          fi

          {
            if [ -f results/summary.md ]; then
              cat results/summary.md
            else
              echo "The run for Jellyfin \`$TAG\` produced no summary."
            fi
            echo
            echo "Screenshots and the server log are attached to [the run]($RUN_URL)."
          } > body.md

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi
