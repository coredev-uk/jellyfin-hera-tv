---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Publishes Hera TV through a Jellyfin plugin repository. Add
#   https://raw.githubusercontent.com/coredev-uk/jellyfin-hera-tv/manifest/manifest.json
# under Dashboard > Plugins > Repositories and Jellyfin installs and updates the plugin from it.
#
# A push to main whose meta.json version has no v<version> tag yet builds the plugin, zips the DLL and
# meta.json as hera-tv_<version>.zip, creates the GitHub release with it, and regenerates manifest.json
# from every release onto the orphan `manifest` branch. A version already released is left alone.
# Run by hand, it regenerates the manifest even when the release exists.
#
# A release is published only after compat.yaml has passed on the same commit: the plugin has then
# loaded in a real Jellyfin, answered every endpoint and drawn every kind of page without a module
# standing aside. The job waits for that run to finish and fails if it failed or never started.
name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Waits for the compat run, which takes up to half an hour.
    timeout-minutes: 60
    # Needs to create the release and push the manifest branch, and to read the compat run.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version=$(jq -r .version meta.json)
          project=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Jellyfin.Plugin.HeraTv.csproj)
          if [[ "$version" != "$project" ]]; then
            echo "::error::meta.json says $version but the project says $project"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compatibility
        if: ${{ steps.version.outputs.released == 'false' }}
        run: |
          run=""
          for attempt in $(seq 1 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow compat.yaml --commit "$GITHUB_SHA" --event push --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            echo "No compat run for ${GITHUB_SHA::7} yet (attempt ${attempt})"
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::compat.yaml has no run for ${GITHUB_SHA::7}; a release needs one that passed"
            exit 1
          fi
          echo "Waiting for https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run}"
          # --exit-status makes a failed or cancelled run fail this step.
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null

      # The web files lowered for older TV browsers (tools/legacy), embedded like the rest.
      - name: Legacy web assets
        if: ${{ steps.version.outputs.released == 'false' }}
        uses: ./.github/actions/legacy-assets

      - name: Setup .NET
        if: ${{ steps.version.outputs.released == 'false' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: ${{ steps.version.outputs.released == 'false' }}
        run: dotnet build Jellyfin.Plugin.HeraTv.csproj -c Release -o out

      # A release without them would serve older TV browsers Jellyfin's own page.
      - name: Legacy assets are in the plugin
        if: ${{ steps.version.outputs.released == 'false' }}
        run: .github/scripts/legacy-embedded.sh out/Jellyfin.Plugin.HeraTv.dll

      - name: Package
        if: ${{ steps.version.outputs.released == 'false' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          zip -j -X "dist/hera-tv_${VERSION}.zip" out/Jellyfin.Plugin.HeraTv.dll meta.json
          unzip -l "dist/hera-tv_${VERSION}.zip"

      - name: Release
        if: ${{ steps.version.outputs.released == 'false' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # meta.json's changelog, written in Markdown, is the release's notes; the manifest links
          # each version's Revision History entry to them (.github/scripts/manifest.sh).
          jq -r .changelog meta.json > notes.md
          gh release create "v${VERSION}" "dist/hera-tv_${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Hera TV ${VERSION}" --notes-file notes.md

      - name: Manifest
        if: ${{ steps.version.outputs.released == 'false' || github.event_name == 'workflow_dispatch' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The releases list can lag a release just created (1.10.4 published a manifest without
          # itself): wait until it names this version.
          for attempt in $(seq 1 12); do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" > releases.json
            jq -e --arg tag "v${VERSION}" 'any(.[]; .tag_name == $tag)' releases.json >/dev/null && break
            echo "v${VERSION} not listed yet (attempt ${attempt})"
            sleep 10
          done
          jq -e --arg tag "v${VERSION}" 'any(.[]; .tag_name == $tag)' releases.json >/dev/null
          .github/scripts/manifest.sh releases.json > manifest.json
          jq -e '.[0].versions | length > 0' manifest.json >/dev/null

      - name: Publish manifest
        if: ${{ steps.version.outputs.released == 'false' || github.event_name == 'workflow_dispatch' }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q manifest-branch
          cp manifest.json manifest-branch/
          cd manifest-branch
          # A fresh repository: the identity has to be set here, not in the checkout above.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan manifest
          if git fetch -q "$remote" manifest; then
            git reset -q FETCH_HEAD
            git restore README.md
          else
            {
              echo "# Hera TV plugin repository"
              echo
              echo "Generated by the release workflow on main. In Jellyfin, add"
              echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/manifest/manifest.json"
              echo "under Dashboard > Plugins > Repositories."
            } > README.md
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -q -m "Manifest for ${GITHUB_SHA::7}"
            git push -q "$remote" HEAD:manifest
          fi
