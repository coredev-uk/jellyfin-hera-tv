---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
# Builds the copy of the web files for older TV browsers (Tizen 5, webOS 4: Chromium 53 to 85) into
# web-legacy/, which the project embeds when it is there (tools/legacy). Every job that runs
# `dotnet build` for a plugin that is used or shipped runs this first: a build without it still works,
# but serves those TVs Jellyfin's own page. The checkout must already be there.
name: Legacy web assets
description: Install the Node tooling and build web-legacy/ for the plugin build.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Build
      shell: bash
      run: |
        npm ci
        npm run build:legacy
